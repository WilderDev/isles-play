:root {
  --ink: #1f2d4a;
  --ink2: #4c5d7d;
  --cream: #fff8ef;
  --cream2: #fff0dc;
  --pink: #ffb347;
  --pink2: #ff7a2e;
  --peach: #ffb86b;
  --sky: #7fd1ff;
  --mint: #7de2b8;
  --lemon: #ffe066;
  --lav: #c3a6ff;
  --shadow: 0 2px 0 rgba(40, 55, 52, 0.14), 0 8px 24px rgba(24, 44, 51, 0.19);
  --font: 'Fredoka', 'Nunito', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd4ff; font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app, #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#ui button, #ui input, #ui .clickable, #ui .panel, #ui .slot, #ui .card, #ui .dialog, #ui .battle-ui .b-menu, #ui .b-msg { pointer-events: auto; }
button { font-family: var(--font); }
kbd { font-family: var(--font); font-size: 11px; background: rgba(255, 255, 255, 0.7); border: 1.5px solid rgba(31, 45, 74, 0.3); border-radius: 6px; padding: 0 5px; margin-left: 6px; color: var(--ink2); }

/* ---------- generic ---------- */
.panel { background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--shadow); }
.btn {
  pointer-events: auto; font-family: var(--font); font-weight: 700; font-size: 20px; color: var(--ink);
  padding: 12px 26px; border: 3px solid var(--ink); border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg, #fff 0%, var(--cream2) 100%); box-shadow: 0 5px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s; outline: none;
}
.btn:hover, .btn:focus-visible, .btn.focus { transform: translateY(-2px) scale(1.04); filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: linear-gradient(180deg, #ffc47a, var(--pink2)); color: #fff; text-shadow: 0 2px 0 rgba(31, 45, 74, 0.35); }
.btn.sky { background: linear-gradient(180deg, #b8e8ff, #5ab8f0); color: #fff; text-shadow: 0 2px 0 rgba(31, 45, 74, 0.35); }
.btn.mint { background: linear-gradient(180deg, #b9f5d8, #45c98f); color: #fff; text-shadow: 0 2px 0 rgba(31, 45, 74, 0.35); }
.btn.lemon { background: linear-gradient(180deg, #fff4b0, #ffcc33); }
.btn.small { font-size: 15px; padding: 7px 16px; box-shadow: 0 3px 0 var(--ink); }
.btn:disabled { filter: grayscale(0.8) opacity(0.6); cursor: default; transform: none; }
.type-badge { display: inline-block; color: #fff; font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px; margin-right: 4px; border: 2px solid rgba(31, 45, 74, 0.35); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; transition: opacity 0.3s; }
#hud.off { opacity: 0; }
.hud-tl { position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 8px; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
.ability-badge { display: flex; align-items: center; gap: 8px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; font-weight: 700; box-shadow: 0 4px 0 rgba(31, 45, 74, 0.2); width: max-content; }
.ability-badge .ab-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; border: 2.5px solid var(--ink); }
.ability-badge small { display: block; font-weight: 500; font-size: 11px; color: var(--ink2); }
.hud-tr { position: absolute; right: 16px; top: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.minimap-wrap { position: relative; width: 164px; height: 164px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: var(--shadow); overflow: hidden; background: #6fb7ea; pointer-events: auto; cursor: pointer; }
.minimap-wrap canvas { width: 100%; height: 100%; display: block; }
.minimap-n { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-weight: 700; font-size: 13px; color: #fff; text-shadow: 0 0 3px var(--ink), 0 0 3px var(--ink); }
.pill { background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 14px; font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 rgba(31, 45, 74, 0.2); display: flex; align-items: center; gap: 6px; }
.pill .star { font-size: 20px; }
/* adventure lane: Sky Shells + treasure chests found */
.pill.shells { gap: 4px; }
.pill.shells b { margin-right: 6px; }
.pill.shells.bump { animation: shellbump 0.35s ease-out; }
@keyframes shellbump { 40% { transform: scale(1.18); } }
.sidequest { position: absolute; left: 16px; top: 64px; pointer-events: none; max-width: min(330px, 56vw); background: #eaf7ff; border: 3px solid var(--ink); border-radius: 14px; padding: 5px 12px; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 rgba(31, 45, 74, 0.2); }
.sidequest.hidden { display: none; }

.bigtext h1 { margin: 0; font-size: 64px; font-weight: 700; color: #fff; letter-spacing: 2px; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.bigtext.glimmer h1 { background: linear-gradient(180deg, #fff6b0, #ffc400); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 var(--ink)); -webkit-text-stroke: 3px var(--ink); }
.bigtext p { margin: 8px 0 0; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 6px var(--ink); }
@keyframes bigIn { from { transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); opacity: 0; } }
.bigpop { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 46px; font-weight: 700; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; animation: popper 1.1s forwards; text-shadow: 0 5px 0 var(--ink); white-space: nowrap; }
/* "You got an item!" (ui.itemGet): the item big in a glowing circle, rays turning behind it */
.itemget { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 42%, rgba(20, 14, 40, 0.35), rgba(20, 14, 40, 0.7)); animation: igFade 0.3s ease-out; pointer-events: none; }
.itemget.out { opacity: 0; transition: opacity 0.3s; }
.itemget .ig-rays { position: absolute; left: 50%; top: 42%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 226, 120, 0.28) 0 10deg, rgba(255, 226, 120, 0) 10deg 24deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); animation: igSpin 9s linear infinite; }
.itemget .ig-ring { position: relative; width: 220px; height: 220px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 38%, #fffbe6, var(--ig) 72%); border: 8px solid var(--ink); box-shadow: 0 0 0 6px #fff, 0 0 60px 18px var(--ig), 0 10px 0 6px var(--ink); animation: igPop 0.6s cubic-bezier(.3, 1.7, .5, 1); margin-top: -4vh; }
.itemget .ig-ring img { width: 70%; height: 70%; object-fit: contain; image-rendering: auto; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35)); animation: igBob 1.6s ease-in-out infinite; }
.itemget .ig-ring span { font-size: 120px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35)); animation: igBob 1.6s ease-in-out infinite; }
.itemget h1 { position: relative; margin: 26px 0 0; font-size: 56px; font-weight: 700; color: #fff; letter-spacing: 2px; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); text-align: center; }
.itemget p { position: relative; margin: 8px 0 0; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 6px var(--ink); text-align: center; }
@media (max-width: 700px) { .itemget .ig-ring { width: 160px; height: 160px; } .itemget h1 { font-size: 38px; } .itemget p { font-size: 20px; } .itemget .ig-ring span { font-size: 86px; } }
@keyframes igPop { from { transform: scale(0.1) rotate(-20deg); opacity: 0; } }
@keyframes igSpin { to { transform: rotate(360deg); } }
@keyframes igBob { 50% { transform: translateY(-8px) scale(1.04); } }
@keyframes igFade { from { opacity: 0; } }
@keyframes popper { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }
.evo-overlay { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(40, 20, 80, 0) 30%, rgba(20, 10, 50, 0.75) 100%); opacity: 0; transition: opacity 0.8s; }
.evo-overlay.on { opacity: 1; }
.cine-text { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); background: rgba(255, 248, 239, 0.96); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 34px; font-size: 30px; font-weight: 700; text-align: center; box-shadow: var(--shadow); animation: dialogIn 0.4s; max-width: 90vw; }
.cine-text.celebrate { background: linear-gradient(180deg, #fff6c0, #ffd84a); font-size: 34px; }
.battle-intro { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #ffffff 0 40px, #dff0ff 40px 80px); animation: bIntro 0.7s forwards; }
@keyframes bIntro { 0% { clip-path: circle(0% at 50% 50%); } 45% { clip-path: circle(80% at 50% 50%); opacity: 1; } 100% { clip-path: circle(80% at 50% 50%); opacity: 0; } }

/* ---------- dialog ---------- */
.dialog { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(860px, 94vw); min-height: 130px; padding: 18px 26px 18px 128px; background: var(--cream); border: 4px solid var(--ink); border-radius: 28px; box-shadow: var(--shadow); font-size: 22px; font-weight: 600; line-height: 1.35; animation: dialogIn 0.3s; cursor: pointer; }
.dialog .who { position: absolute; left: 22px; top: -20px; background: linear-gradient(180deg, #ffc47a, var(--pink2)); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 16px; font-size: 17px; font-weight: 700; text-shadow: 0 1px 0 var(--ink); }
.dialog .face { position: absolute; left: 18px; top: 22px; width: 94px; height: 94px; border-radius: 24px; border: 3px solid var(--ink); background: radial-gradient(circle, #fff, #ffe7c9); display: grid; place-items: center; font-size: 58px; overflow: hidden; }
.dialog .face img { width: 100%; height: 100%; object-fit: contain; }
.dialog .more { position: absolute; right: 22px; bottom: 10px; font-size: 22px; animation: bob 0.8s infinite; }
@keyframes bob { 50% { transform: translateY(5px); } }

/* ---------- menus ---------- */
.menu-back { position: absolute; inset: 0; background: rgba(15, 30, 60, 0.35); backdrop-filter: blur(3px); pointer-events: auto; display: grid; place-items: center; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } }
.menu { width: min(980px, 96vw); height: min(640px, 92vh); display: flex; flex-direction: column; overflow: hidden; animation: menuIn 0.25s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes menuIn { from { transform: scale(0.85); opacity: 0; } }
.menu-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; flex-wrap: wrap; }
.tab { font-family: var(--font); font-weight: 700; font-size: 18px; padding: 8px 18px; border-radius: 16px 16px 0 0; border: 3px solid var(--ink); border-bottom: none; background: var(--cream2); color: var(--ink2); cursor: pointer; }
.tab.on { background: #fff; color: var(--ink); transform: translateY(3px); }
.menu-close { margin-left: auto; }
.menu-body { flex: 1; background: #fff; border-top: 3px solid var(--ink); padding: 16px; overflow: auto; }
.inv-grid { display: grid; grid-template-columns: repeat(9, 58px); gap: 6px; justify-content: center; }
.inv-sep { grid-column: 1 / -1; height: 10px; border-bottom: 2.5px dashed rgba(31, 45, 74, 0.3); margin-bottom: 6px; }
.inv-layout { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.inv-info { width: 250px; min-height: 180px; padding: 12px; border-radius: 18px; background: var(--cream); border: 2.5px solid rgba(31, 45, 74, 0.3); }
.inv-info h3 { margin: 0 0 6px; }
.cursor-item { position: fixed; width: 48px; height: 48px; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); }
.cursor-item img { width: 100%; height: 100%; }
.cursor-item span { position: absolute; right: -4px; bottom: -4px; font-weight: 700; color: #fff; text-shadow: 0 0 3px var(--ink), 0 0 3px var(--ink); }
.creative-grid { display: grid; grid-template-columns: repeat(auto-fill, 58px); gap: 6px; margin-top: 12px; }
.craft-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.recipe { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; background: var(--cream); border: 2.5px solid rgba(31, 45, 74, 0.3); }
.recipe.ok { border-color: var(--mint); background: linear-gradient(180deg, #fff, #effff6); }
.recipe .out { position: relative; width: 52px; height: 52px; flex: none; }
.recipe .out img { width: 52px; height: 52px; }
.recipe .out b { position: absolute; right: -4px; bottom: -4px; font-size: 14px; color: #fff; text-shadow: 0 0 3px var(--ink), 0 0 3px var(--ink); }
.recipe .mid { flex: 1; min-width: 0; }
.recipe .rname { font-weight: 700; font-size: 16px; }
.recipe .ins { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.recipe .ing { display: flex; align-items: center; gap: 2px; font-weight: 700; font-size: 13px; padding: 1px 6px 1px 1px; border-radius: 99px; background: #fff; border: 2px solid #9adbb8; }
.recipe .ing.no { border-color: #ff9a9a; color: #d43a3a; }
.recipe .ing img { width: 22px; height: 22px; }
.cat-title { font-weight: 700; font-size: 20px; margin: 14px 0 8px; }
.party-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { position: relative; display: flex; gap: 10px; padding: 10px; border-radius: 20px; background: var(--cream); border: 3px solid rgba(31, 45, 74, 0.35); cursor: pointer; transition: transform 0.1s; }
.card:hover { transform: translateY(-2px); }
.card.sel { border-color: var(--pink2); box-shadow: 0 0 0 3px #ffd9b0; }
.card.lead::after { content: '★ Leader'; position: absolute; right: 10px; top: 8px; font-size: 12px; font-weight: 700; color: #fff; background: var(--pink2); border-radius: 99px; padding: 1px 8px; }
.card img.por { width: 76px; height: 76px; border-radius: 16px; background: radial-gradient(circle, #fff, #e3f1ff); border: 2.5px solid var(--ink); flex: none; }
.card .cn { font-weight: 700; font-size: 17px; }
.card .cn small { color: var(--ink2); font-size: 13px; }
.card.fainted img.por { filter: grayscale(1); }
.pom-detail { margin-top: 14px; padding: 14px; border-radius: 20px; background: var(--cream); border: 3px solid rgba(31, 45, 74, 0.3); display: flex; gap: 16px; flex-wrap: wrap; }
.pom-detail img.big { width: 150px; height: 150px; border-radius: 22px; background: radial-gradient(circle, #fff, #e3f1ff); border: 3px solid var(--ink); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
.move-chip { padding: 5px 10px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 14px; border: 2px solid rgba(31, 45, 74, 0.4); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.move-chip small { display: block; font-weight: 500; font-size: 11px; opacity: 0.95; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.box-grid { display: grid; grid-template-columns: repeat(auto-fill, 64px); gap: 6px; margin-top: 8px; }
.box-cell { width: 64px; height: 64px; border-radius: 14px; border: 2.5px solid rgba(31, 45, 74, 0.35); background: radial-gradient(circle, #fff, #f3ecff); cursor: pointer; }
.box-cell img { width: 100%; height: 100%; }
.box-cell.sel { border-color: var(--pink2); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.dex-cell { position: relative; border-radius: 16px; border: 2.5px solid rgba(31, 45, 74, 0.3); background: radial-gradient(circle, #fff, #f0f6ff); padding: 4px; text-align: center; cursor: pointer; font-weight: 700; font-size: 12px; }
.dex-cell img { width: 88px; height: 88px; }
.dex-cell.unseen img, .dex-cell.seen img { filter: brightness(0) opacity(0.35); }
.dex-cell.seen img { filter: brightness(0) opacity(0.65); }
.dex-cell .num { position: absolute; left: 6px; top: 3px; color: var(--ink2); font-size: 11px; }
.dex-cell .got { position: absolute; right: 6px; top: 4px; font-size: 14px; }
.dex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; font-size: 18px; }
.map-wrap { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.map-wrap canvas { width: min(540px, 80vh, 90vw); height: min(540px, 80vh, 90vw); border-radius: 24px; border: 4px solid var(--ink); background: #4aa0e0; }
.legend { max-width: 260px; font-weight: 600; font-size: 15px; }
.legend div { margin: 4px 0; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 6px; border-bottom: 2px dashed rgba(31, 45, 74, 0.15); font-weight: 600; font-size: 18px; }
.settings-row input[type=range] { width: 220px; accent-color: var(--pink2); }
.seg { display: flex; gap: 4px; }
.seg button { font-family: var(--font); font-weight: 700; padding: 6px 12px; border-radius: 12px; border: 2.5px solid var(--ink); background: #fff; cursor: pointer; }
.seg button.on { background: var(--pink2); color: #fff; }
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.help-cols h3 { margin: 4px 0 8px; }
.help-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1.5px dashed rgba(31, 45, 74, 0.15); font-size: 16px; }
.help-row b { background: var(--cream2); border: 2px solid rgba(31, 45, 74, 0.4); border-radius: 8px; padding: 0 8px; white-space: nowrap; }
.pause-list { display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: 320px; padding: 26px; }
.pause-list h2 { margin: 0 0 6px; text-align: center; font-size: 34px; }
.ferry-tip { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink2); text-align: center; }
.pause-who { text-align: center; font-weight: 700; color: var(--ink2); margin: -8px 0 4px; }
.pause-idle { text-align: center; font-weight: 800; color: var(--ink2); background: var(--cream2); border-radius: 12px; padding: 8px 10px; margin: -4px 0 2px; }
.pause-quick { display: flex; gap: 8px; }
.pause-quick .btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 24px; padding: 8px 4px; }
.pause-quick .btn small { font-size: 12px; font-weight: 800; white-space: nowrap; }
/* with a mouse, the camera holds the pointer, so the round buttons over the map can't be clicked:
   they live in the pause menu instead (H / G keys too). Touch screens and Hearth Isle keep them. */
body:not(.touch-mode):not(.at-home) .hud-tr .voice-btn, body:not(.touch-mode) .hud-tr .home-btn { display: none; }
.settings-menu { height: auto; max-height: min(700px, 92vh); width: min(720px, 96vw); }
.set-h { margin: 14px 0 2px; font-size: 20px; color: var(--ink); background: linear-gradient(90deg, #b8e8ff, transparent); border-radius: 10px; padding: 4px 10px; }
.set-h:first-child { margin-top: 0; }
.settings-row small { font-size: 13px; color: var(--ink2); font-weight: 600; }
.btn.danger { background: #ff5a3d; color: #fff; }
.btn.holding { background: linear-gradient(to right, #b3261e 50%, #ff5a3d 50%); background-size: 200% 100%; background-position: right; animation: holdfill 2s linear forwards; }
@keyframes holdfill { to { background-position: left; } }
@media (max-width: 600px) { .settings-row { flex-wrap: wrap; font-size: 16px; } .settings-row input[type=range] { width: 100%; } }

/* ---------- battle ---------- */
.battle-ui { position: absolute; inset: 0; }
.b-card { position: absolute; width: 300px; padding: 10px 14px; background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); animation: toastIn 0.4s; }
.b-foe { left: 20px; top: 20px; }
.b-ally { right: 20px; bottom: 230px; }
.b-name { font-weight: 700; font-size: 21px; }
.b-name small { font-size: 15px; color: var(--ink2); margin-left: 4px; }
.b-types { margin: 2px 0 4px; }
.b-hp { height: 14px; background: #e8dcd0; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; }
.b-hpfill { height: 100%; transition: width 0.6s ease-out; border-radius: 99px; }
.b-hptext { text-align: right; font-weight: 700; font-size: 14px; margin-top: 2px; }
.b-xp { height: 7px; background: #e6eef8; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.b-xpfill { height: 100%; background: linear-gradient(180deg, #9fd8ff, #4a9af0); transition: width 0.6s; }
.b-caught { position: absolute; right: 10px; top: 8px; }
.b-caught img { width: 26px; }
.b-msg { position: absolute; left: 20px; right: 20px; bottom: 20px; min-height: 96px; padding: 18px 24px; background: var(--cream); border: 4px solid var(--ink); border-radius: 26px; box-shadow: var(--shadow); font-size: 24px; font-weight: 700; display: flex; align-items: flex-start; }
.b-msg span { max-width: 48%; }
.b-menu { position: absolute; right: 30px; bottom: 30px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: 52%; }
.b-btn { font-family: var(--font); font-weight: 700; font-size: 19px; padding: 10px 18px; border: 3px solid var(--ink); border-radius: 18px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); background: #fff; color: var(--ink); transition: transform 0.08s; display: flex; align-items: center; gap: 6px; outline: none; }
.b-btn:hover, .b-btn:focus-visible, .b-btn.focus { transform: translateY(-2px) scale(1.04); }
.b-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.b-btn img { width: 30px; height: 30px; }
.b-btn kbd { margin-left: 4px; }
.bb-fight { background: linear-gradient(180deg, #ffb3a8, #ff6a5a); color: #fff; text-shadow: 0 1px 0 var(--ink); }
.bb-pod { background: linear-gradient(180deg, #ffe08a, #f0a020); color: #fff; text-shadow: 0 1px 0 var(--ink); }
.bb-bag { background: linear-gradient(180deg, #fff4b0, #ffcc33); }
.bb-swap { background: linear-gradient(180deg, #b8e8ff, #5ab8f0); color: #fff; text-shadow: 0 1px 0 var(--ink); }
.bb-run { background: linear-gradient(180deg, #e8e8f0, #b8b8c8); }
.bb-move { flex-direction: column; align-items: flex-start; gap: 0; min-width: 190px; background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 55%, white), var(--tc)); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); position: relative; }
.bb-move .mv-name { font-size: 18px; }
.bb-move .mv-info { font-size: 12px; font-weight: 600; opacity: 0.95; }
.bb-move kbd { position: absolute; right: 6px; top: 6px; }
.eff { position: absolute; right: 8px; bottom: 5px; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: #fff; color: #e03a6a; text-shadow: none; border: 2px solid var(--ink); }
.eff.down { color: #6a7a8a; }
.bb-item { background: var(--cream); }
.bb-back { background: #fff; font-size: 16px; }
.b-btn.fainted { filter: grayscale(1); opacity: 0.6; }
.mini-portrait { width: 34px !important; height: 34px !important; }
.mini-hp { font-size: 13px; color: var(--ink2); }

/* ---------- title & new game ---------- */
.title-screen { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0) 30%, rgba(15, 35, 80, 0.45) 100%); }
.logo { font-size: clamp(44px, 8.5vw, 116px); font-weight: 700; line-height: 0.95; letter-spacing: 2px; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.35em; }
.logo-word { display: flex; gap: 2px; }
.logo span { display: inline-block; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 9px 0 var(--ink); animation: letter 2.4s ease-in-out infinite; }
.logo-word span:nth-child(odd) { color: #ffd36b; }
@keyframes letter { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
.subtitle { font-size: clamp(18px, 3vw, 30px); font-weight: 700; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 10px rgba(31, 45, 74, 0.5); margin-top: -4px; }
.title-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; min-width: 300px; }
/* bedtime recap: a starry card over the dark */
.recap { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; background: radial-gradient(ellipse at 50% 30%, #2a3f7a, #0f1a3a); animation: fadeIn 0.4s; padding: 16px; }
.recap.out { opacity: 0; transition: opacity 0.3s; }
.recap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(2px 2px at 12% 20%, #fff, transparent), radial-gradient(2px 2px at 80% 15%, #ffe066, transparent), radial-gradient(1.5px 1.5px at 30% 70%, #fff, transparent), radial-gradient(2px 2px at 65% 55%, #9fe8ff, transparent), radial-gradient(1.5px 1.5px at 90% 80%, #fff, transparent), radial-gradient(2px 2px at 45% 12%, #fff, transparent); pointer-events: none; }
.recap-card { position: relative; width: min(460px, 100%); background: var(--cream); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); padding: 22px 24px; text-align: center; animation: menuIn 0.4s cubic-bezier(.3, 1.4, .5, 1); }
.recap-card h2 { margin: 0 0 12px; font-size: 32px; }
.recap-lines { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.recap-line { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 700; text-align: left; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 14px; animation: popIn 0.4s cubic-bezier(.3, 1.6, .5, 1) both; }
.recap-line span { font-size: 28px; }
.recap-buddy { font-weight: 700; color: var(--ink2); margin-bottom: 14px; animation: popIn 0.4s both; }
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } }
/* map: fly to a lit warp lantern */
.warp-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.warp-list h3 { margin: 0; font-size: 18px; }
.warp-list .btn { text-align: left; }
/* save slots: one big card per adventure */
.save-cards { display: flex; gap: 16px; margin-top: 18px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
.save-card { position: relative; width: 200px; animation: menuIn 0.35s cubic-bezier(.3, 1.4, .5, 1) both; }
.save-card:nth-child(2) { animation-delay: 0.06s; } .save-card:nth-child(3) { animation-delay: 0.12s; }
.sc-main { width: 100%; min-height: 236px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 14px; cursor: pointer; font-family: var(--font); color: var(--ink);
  background: linear-gradient(180deg, #7fd1ff 0 64px, var(--cream) 64px); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); transition: transform 0.1s, box-shadow 0.1s; outline: none; }
.sc-main:hover, .sc-main:focus-visible { transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 0 var(--ink), 0 0 0 5px #ffd36b; }
.sc-main:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.save-card.empty .sc-main { background: linear-gradient(180deg, #45c98f 0 64px, rgba(255, 248, 239, 0.9) 64px); border-style: dashed; }
.sc-face { width: 86px; height: 86px; border-radius: 50%; border: 3px solid var(--ink); position: relative; overflow: hidden; background: var(--outfit); box-shadow: 0 4px 0 rgba(31, 45, 74, 0.25); }
.sc-face::before { content: ''; position: absolute; left: 50%; top: 14px; width: 50px; height: 46px; transform: translateX(-50%); border-radius: 50% 50% 46% 46%; background: var(--skin); border: 3px solid var(--ink);
  box-shadow: inset 0 14px 0 var(--hair); }
.sc-face::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 12px; height: 10px; border-radius: 6px; background: var(--scarf); border: 2px solid var(--ink); }
.sc-face i { position: absolute; left: 50%; top: 38px; width: 22px; height: 6px; transform: translateX(-50%); background: radial-gradient(circle at 3px 3px, var(--ink) 3px, transparent 3.5px) 0 0 / 16px 6px repeat-x; }
.sc-new { font-size: 54px; width: 86px; height: 86px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 3px dashed var(--ink); }
.sc-name { font-size: 24px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 15px; font-weight: 700; color: var(--ink2); }
.sc-play { margin-top: auto; background: linear-gradient(180deg, #ffc47a, var(--pink2)); color: #fff; text-shadow: 0 2px 0 rgba(31, 45, 74, 0.35); font-weight: 700; font-size: 18px; padding: 6px 22px; border: 3px solid var(--ink); border-radius: 999px; }
.sc-del { position: absolute; top: 8px; right: 8px; font-family: var(--font); font-size: 16px; font-weight: 700; background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 9px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); outline: none; }
.sc-del:focus-visible { box-shadow: 0 3px 0 var(--ink), 0 0 0 4px #ffd36b; }
.save-card.sure .sc-del { left: 8px; right: 8px; background: #ff5a3d; color: #fff; font-size: 15px; animation: wobble 0.4s; }
.sc-del.danger { left: 8px; right: 8px; background: #ff5a3d; color: #fff; font-size: 15px; }
.sc-del.holding { background: linear-gradient(to right, #b3261e 50%, #ff5a3d 50%); background-size: 200% 100%; background-position: right; animation: holdfill 2s linear forwards; }
@keyframes wobble { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
@media (max-width: 700px) { .save-card { width: 150px; } .sc-main { min-height: 200px; } .sc-face, .sc-new { width: 64px; height: 64px; } .sc-face::before { top: 8px; width: 38px; height: 36px; } .sc-face i { top: 26px; } .sc-name { font-size: 19px; } }
.title-foot { position: absolute; bottom: 12px; font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 0 var(--ink); }
.newgame { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; background: rgba(15, 30, 60, 0.25); }
.ng-panel { padding: 26px 30px; text-align: center; width: min(760px, 94vw); animation: menuIn 0.3s cubic-bezier(.3, 1.4, .5, 1); }
.ng-panel h2 { margin: 0 0 14px; font-size: 34px; }
.ng-panel input { font-family: var(--font); font-size: 30px; font-weight: 700; text-align: center; padding: 10px 18px; border-radius: 18px; border: 3px solid var(--ink); width: 320px; outline: none; color: var(--ink); background: #fff; }
.swatches { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0 18px; }
.swatch { width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer; box-shadow: 0 5px 0 rgba(31, 45, 74, 0.3), inset -6px -8px 0 rgba(0, 0, 0, 0.08); transition: transform 0.1s; }
.swatch.on { transform: scale(1.18); box-shadow: 0 0 0 5px #fff, 0 0 0 8px var(--pink2); }
.newgame.side { place-items: center start; padding-left: max(24px, 4vw); background: linear-gradient(90deg, rgba(15, 30, 60, 0.3), rgba(15, 30, 60, 0) 60%); pointer-events: none; }
.newgame.side .ng-panel { width: min(520px, 48vw); pointer-events: auto; padding: 22px 24px; }
.newgame.side .ng-panel h2 { font-size: 28px; }
.newgame.side .ng-panel input { width: 100%; max-width: 320px; }
.newgame.side .swatches { margin: 6px 0 10px; gap: 10px; }
.newgame.side .swatch { width: 48px; height: 48px; }
.sw-label { font-weight: 700; margin-top: 6px; }
.ng-tip { margin: 4px 0 12px; font-size: 14px; color: var(--ink2); font-weight: 600; }
/* dress-up picker (src/ui/wardrobe.js): tabs, big picture buttons, swatches, surprise button */
.wd-tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 8px; }
.wd-tab { font-family: var(--font); font-weight: 700; font-size: 13px; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 4px 8px 5px; min-width: 64px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 rgba(31, 45, 74, 0.25); }
.wd-tab span { font-size: 26px; line-height: 1.1; }
.wd-tab.on { background: var(--pink, #ff6fa8); color: #fff; transform: translateY(-2px); }
.wd-body { max-height: min(46vh, 430px); overflow-y: auto; padding: 4px 2px 6px; }
.wd-label { font-weight: 700; margin: 8px 0 4px; font-size: 15px; }
.wd-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.wd-opt { font-family: var(--font); font-weight: 700; font-size: 12px; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 16px; width: 76px; padding: 4px 2px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 4px 0 rgba(31, 45, 74, 0.25); transition: transform 0.1s; }
.wd-opt span { font-size: 32px; line-height: 1.15; }
.wd-opt:hover { transform: translateY(-2px); }
.wd-opt.on { background: #fff4c2; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--pink2, #ff6fa8); }
.wd-opt.locked { opacity: 0.55; filter: grayscale(0.6); }
/* dress-up colour rows (any layout): smaller circles, room for the selection ring, labels never covered */
.wd-sw.swatches, .newgame.side .wd-sw.swatches { margin: 4px 0 14px; gap: 12px; padding: 6px 4px; }
.wd-sw .swatch, .newgame.side .wd-sw .swatch { width: 42px; height: 42px; border-width: 3px; }
.wd-sw .swatch.on { transform: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--pink2, #ff6fa8); }
.wd-body .wd-label { margin: 14px 0 2px; position: relative; z-index: 1; }

.wd-note { min-height: 20px; font-weight: 700; font-size: 14px; color: var(--ink2); margin-top: 6px; }
.wd-foot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
@media (max-width: 700px), (max-aspect-ratio: 11/10) {
  .wd-tab { min-width: 48px; font-size: 11px; padding: 3px 5px; } .wd-tab span { font-size: 22px; }
  .wd-body { max-height: 30vh; } .wd-opt { width: 64px; } .wd-opt span { font-size: 26px; }
  .newgame.side .wd-sw .swatch { width: 34px; height: 34px; }
}
/* the dress-up panel always fits the window: on a short screen the options scroll and the
   "Looking good!" button stays on screen (it was below the bottom edge at 540 px tall, so you couldn't finish) */
.newgame .ng-panel:has(.wd-body) { max-height: calc(100dvh - 16px); box-sizing: border-box; display: flex; flex-direction: column; }
.newgame .ng-panel:has(.wd-body) > * { flex-shrink: 0; }
.newgame .ng-panel:has(.wd-body) > .wd-body { flex: 0 1 auto; min-height: 90px; }
@media (max-height: 640px) {
  .newgame.side .ng-panel:has(.wd-body) { padding: 12px 16px; }
  .newgame.side .ng-panel:has(.wd-body) h2 { font-size: 22px; margin-bottom: 6px; }
}
.ng-world { display: block; margin: 14px auto 0; background: none; border: 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink2); opacity: .7; cursor: pointer; text-decoration: underline dotted; }
.ng-world:hover { opacity: 1; }
@media (max-aspect-ratio: 11/10) {
  .newgame.side { place-items: end center; padding: 0 0 12px; background: linear-gradient(0deg, rgba(15, 30, 60, 0.3), rgba(15, 30, 60, 0) 55%); }
  .newgame.side .ng-panel { width: min(560px, 96vw); padding: 14px 16px; }
  .newgame.side .ng-panel h2 { font-size: 22px; margin-bottom: 6px; }
  .newgame.side .swatch { width: 40px; height: 40px; }
  .newgame.side .swatches { margin: 2px 0 6px; gap: 8px; }
  .newgame.side .sw-label { margin-top: 2px; font-size: 14px; }
}
.choose { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; pointer-events: auto; background: linear-gradient(0deg, rgba(15, 30, 60, .35), rgba(15, 30, 60, 0) 55%); }
.ch-panel { padding: 16px 20px; text-align: center; width: min(820px, 96vw); animation: menuIn .3s cubic-bezier(.3, 1.4, .5, 1); }
.ch-panel h2 { margin: 0 0 10px; font-size: 30px; }
.ch-foot { margin: 10px 0 0; font-weight: 600; color: var(--ink2); }
.ch-panel .starter { font-family: var(--font); color: var(--ink); }
.ch-panel .starter img { width: 110px; height: 110px; }
.ch-panel .starter p { min-height: 0; }
@media (max-width: 700px) { .ch-panel .starter { width: 30%; min-width: 0; padding: 8px; } .ch-panel .starter p { display: none; } .ch-panel .starter img { width: 70px; height: 70px; } }
.starters { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.starter { width: 210px; padding: 12px; border-radius: 22px; border: 3px solid var(--ink); background: #fff; cursor: pointer; transition: transform 0.12s; }
.starter:hover, .starter.focus { transform: translateY(-6px) scale(1.03); box-shadow: 0 12px 24px rgba(31, 45, 74, 0.25); }
.starter img { width: 150px; height: 150px; }
.starter h3 { margin: 4px 0; font-size: 24px; }
.starter p { margin: 6px 0 0; font-size: 14px; color: var(--ink2); min-height: 54px; }
.credits { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #3a2a6a, #140a2a); color: #fff; display: grid; place-items: center; text-align: center; pointer-events: auto; animation: fadeIn 1s; }
.credits h1 { font-size: 64px; margin: 0; -webkit-text-stroke: 3px #000; paint-order: stroke fill; background: linear-gradient(180deg, #fff6b0, #ffc400); -webkit-background-clip: text; background-clip: text; color: transparent; }
.credits p { font-size: 24px; font-weight: 600; }
.credits .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 26px; justify-content: center; font-size: 22px; margin: 18px 0; }
.credits { overflow: auto; padding: 24px 12px; }
.credits h1 { font-size: clamp(28px, 5vw, 64px); }
.credits p { margin: 12px 0; font-size: clamp(16px, 2.2vw, 24px); }
.credits .family-photo { width: min(640px, 78vw); max-height: 37vh; object-fit: cover; border: 3px solid #ffc03a; border-radius: 20px; }

.nick { padding: 24px; text-align: center; width: min(520px, 92vw); }
.nick img { width: 130px; height: 130px; }
.nc-title { font-size: 20px; font-weight: 700; color: var(--ink2); }
.nc-name { font-size: 46px; font-weight: 700; line-height: 1.1; margin: 4px 0 2px; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.nc-name.pop { animation: ncpop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes ncpop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.nc-sub { font-weight: 600; color: var(--ink2); }
.nc-input { font-family: var(--font); font-size: 30px; font-weight: 700; text-align: center; padding: 8px 16px; border-radius: 18px; border: 3px solid var(--ink); width: min(320px, 80%); outline: none; color: var(--ink); background: #fff; margin-top: 8px; }

/* ---------- touch controls ---------- */
#touch { position: fixed; inset: 0; pointer-events: none; z-index: 8; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#touch.hide { display: none; }
#touch.stick-only .t-btns, #touch.stick-only .t-top { display: none; }
#touch .t-stick { position: absolute; left: calc(28px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); border: 3px solid rgba(31, 45, 74, 0.45); pointer-events: auto; display: grid; place-items: center; transition: opacity .2s; }
#touch .t-stick.held { background: rgba(255, 255, 255, 0.45); transition: none; }
#touch .t-knob { width: 64px; height: 64px; border-radius: 50%; background: rgba(255, 255, 255, 0.95); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(31, 45, 74, .25); }
/* big thumb buttons in an arc around the bottom-right corner: Jump biggest, Action next to it */
#touch .t-btns { position: absolute; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 250px; height: 250px; pointer-events: none; }
#touch .t-btn { position: absolute; pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--ink); background: rgba(255, 248, 239, 0.92); color: var(--ink); font-size: 28px; font-family: var(--font); font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 5px 0 rgba(31, 45, 74, .25); touch-action: none; -webkit-tap-highlight-color: transparent; }
#touch .t-btn small { font-size: 12px; margin-top: 3px; }
#touch .t-btn.down { transform: translateY(3px) scale(.94); box-shadow: 0 2px 0 rgba(31, 45, 74, .25); }
#touch .t-jump { right: 0; bottom: 0; width: 108px; height: 108px; font-size: 40px; background: linear-gradient(180deg, #fff6d8, #ffd27a); }
#touch .t-act { right: 124px; bottom: 6px; width: 94px; height: 94px; font-size: 36px; }
#touch .t-act.ready { background: linear-gradient(180deg, #d9ffe9, #8fe3b4); animation: tpulse 1s ease-in-out infinite; }
@keyframes tpulse { 50% { transform: scale(1.08); } }
#touch .t-ability { right: 8px; bottom: 124px; }
#touch .t-lantern { right: 100px; bottom: 112px; }
#touch .t-down { right: 100px; bottom: 112px; background: linear-gradient(180deg, #e2f8ff, #8fd7ed); }
#touch .t-ride { right: 176px; bottom: 170px; width: 62px; height: 62px; font-size: 24px; }
#touch .t-ride small { font-size: 11px; }
#touch .t-top { position: absolute; left: calc(16px + env(safe-area-inset-left)); bottom: calc(200px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
#touch .t-sm { pointer-events: auto; width: 56px; height: 56px; border-radius: 18px; border: 3px solid var(--ink); background: rgba(255, 248, 239, 0.92); font-size: 26px; box-shadow: 0 4px 0 rgba(31, 45, 74, .2); touch-action: none; -webkit-tap-highlight-color: transparent; }
#touch .t-sm.down { transform: translateY(2px); }
/* team-up battle: the stick sits above the move panel; key badges mean nothing on a tablet */
#touch.stick-only .t-stick { bottom: calc(150px + env(safe-area-inset-bottom)); }
.touch-mode .b-btn kbd, .touch-mode .mg-card kbd, .touch-mode .hb-tool kbd, .touch-mode .hb-go kbd, .touch-mode [class^="hb-"] kbd { display: none; }
/* phones and short screens: a little smaller so the scene still shows */
@media (max-height: 560px) {
  #touch .t-stick { width: 120px; height: 120px; left: 18px; bottom: 18px; }
  #touch .t-knob { width: 52px; height: 52px; }
  #touch .t-btns { transform: scale(.78); transform-origin: bottom right; }
  #touch .t-top { flex-direction: row; left: 50%; bottom: auto; top: 10px; transform: translateX(-50%); }
  #touch .t-sm { width: 46px; height: 46px; font-size: 22px; border-radius: 14px; }
  /* no room for the round map above the thumb buttons: the 🗺 button opens the big one */
  .touch-mode .minimap-wrap { display: none; }
  .touch-mode .hud-tr { transform: scale(.85); transform-origin: top right; }
  .touch-mode .teach { bottom: 96px; }
}
/* the teach card and helper hand sit above the thumbs on tablets */
.touch-mode .teach { bottom: 150px; }
.touch-mode .dialog { bottom: 18px; }
.touch-mode canvas { touch-action: none; }
.touch-mode .buddybar { bottom: 8px; transform: translateX(-50%) scale(0.85); }
.touch-mode .hint { top: 8px; font-size: 15px; }

@media (max-width: 760px) {
  .hotbar { gap: 3px; padding: 5px; }
  .slot { width: 42px; height: 42px; }
  .slot img { width: 32px; height: 32px; }
  .minimap-wrap { width: 110px; height: 110px; }
  .b-card { width: 220px; }
  .b-ally { bottom: 250px; }
  .b-msg span { max-width: 100%; }
  .b-menu { max-width: 100%; left: 20px; bottom: 120px; justify-content: center; }
  .party-grid { grid-template-columns: 1fr; }
  .help-cols { grid-template-columns: 1fr; }
  .inv-grid { grid-template-columns: repeat(9, 38px); }
  .inv-grid .slot { width: 38px; height: 38px; }
  .inv-grid .slot img { width: 30px; height: 30px; }
}

/* =====================================================================================
   Cozy aesthetic tokens (Hearth Isle look) — warm paper cards, soft serif display type
   ===================================================================================== */
:root {
  --paper: #f8f2e6; --paper2: #efe5d2; --line: #e2d5bd; --bark: #3d3226; --bark2: #7b6b58;
  --sage: #6f9f45; --sage2: #8dbb5b; --coral: #e3785a; --lagoon: #3fa9c0; --gold: #e7b04a;
  --serif: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --sans: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --card-shadow: 0 10px 30px rgba(52, 38, 18, 0.18), 0 2px 6px rgba(52, 38, 18, 0.1);
}
.serif { font-family: var(--serif); }
.card { background: var(--paper); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 18px; box-shadow: var(--card-shadow), inset 0 1px 0 #fff; }

/* ---------- Hearth Isle build controls ---------- */
.hb { position: absolute; inset: 0; pointer-events: none; }
.hb button { pointer-events: auto; font-family: var(--font); cursor: pointer; }
.hb kbd { margin-left: auto; }
.hb-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
.hb-title { background: var(--paper); border-radius: 999px; padding: 8px 18px; font-size: 18px; box-shadow: var(--card-shadow); color: var(--bark); }
.hb-go { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #ffab5e, #e8743a); box-shadow: 0 4px 0 #b9562a, var(--card-shadow); }
.hb-go:hover { filter: brightness(1.06); transform: translateY(-1px); }
.hb-go kbd { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.5); color: #fff; }
.hb-rail { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-radius: 22px; padding: 8px; box-shadow: var(--card-shadow); pointer-events: auto; }
.hb-tool { display: flex; align-items: center; gap: 10px; width: 232px; border: 0; background: transparent; border-radius: 16px; padding: 6px 10px 6px 6px; text-align: left; color: var(--bark); transition: background 0.15s, transform 0.15s; position: relative; }
.hb-tool i { width: 46px; height: 46px; border-radius: 14px; background: var(--paper2); display: grid; place-items: center; flex: none; }
.hb-tool i svg { width: 34px; height: 34px; }
.hb-name { display: flex; flex-direction: column; font-weight: 600; font-size: 16px; line-height: 1.15; }
.hb-name small { font-family: var(--sans); font-weight: 700; font-size: 11.5px; color: var(--bark2); }
.hb-tool:hover { background: rgba(255, 255, 255, 0.7); }
.hb-tool.on { background: #fff; box-shadow: inset 4px 0 0 #f08a3c, 0 2px 8px rgba(0, 0, 0, 0.07); }
.hb-tool.on i { background: #ffe9d2; }
.hb-tool.poor .hb-name small { color: #c9573a; }
.hb-inv { border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; margin-top: 2px; padding-top: 10px; }
.hb-inv i { color: var(--bark2); }
.hb-inv.on { background: #e8795a; color: #fff; box-shadow: none; border-radius: 14px; }
.hb-inv.on i { background: rgba(255, 255, 255, 0.25); color: #fff; }
.hb-inv.on small { color: #ffe9e0; }
.hb-decor { position: absolute; left: 272px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(3, 1fr); max-height: calc(100vh - 150px); overflow-y: auto; gap: 6px; background: var(--paper); border-radius: 20px; padding: 8px; box-shadow: var(--card-shadow); pointer-events: auto; }
.hb-decor button { border: 2px solid transparent; background: var(--paper2); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 118px; color: var(--bark); }

/* "Click to look around": a clicking mouse in the middle of the screen when the game lost the mouse */

.mg-card button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
/* ---------- Sticker Book + Adventurer Rank (src/progress/stickers.js) ---------- */
.stk { --c: #ffc93c; --r: 0deg; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff 0 18%, var(--c) 60%); border: 4px solid #fff; box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px rgba(31, 45, 74, 0.35); transform: rotate(var(--r)); flex: none; }
.stk span { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(31, 45, 74, 0.35)); }
.stk.ghost { background: #e6e1ea; border-style: dashed; border-color: #b9b2c4; box-shadow: 0 0 0 3px rgba(31, 45, 74, 0.25); }
.stk.ghost span { filter: grayscale(1) opacity(0.45); font-size: 28px; color: var(--ink2); font-weight: 700; }
.stk-big { width: 150px; height: 150px; border-width: 7px; }
.stk-big span { font-size: 86px; }
.stk-pop { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; z-index: 40; }
.stk-pop .stk-big { animation: stkSlap 0.7s cubic-bezier(.3, 1.7, .5, 1) both; }
.stk-pop-label { font-size: 34px; font-weight: 700; color: #fff6b0; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: bigIn 0.5s cubic-bezier(.3, 1.6, .5, 1) both; }
.stk-pop-name { font-size: 30px; font-weight: 700; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 8px var(--ink); animation: bigIn 0.5s 0.25s cubic-bezier(.3, 1.6, .5, 1) both; }
.stk-pop.out { animation: stkOut 0.35s ease-in forwards; }
@keyframes stkSlap { 0% { transform: scale(2.6) rotate(-40deg); opacity: 0; } 60% { transform: scale(0.9) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); } }
@keyframes stkOut { to { opacity: 0; transform: translate(-50%, -80%) scale(0.6); } }
.stk-meter { position: relative; width: 220px; height: 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); border: 3px solid var(--ink); overflow: visible; }
.stk-meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffd23a, #ff8a3a); transition: width 0.9s 0.5s cubic-bezier(.3, 1.3, .5, 1); }
.stk-meter b { position: absolute; right: -18px; top: 50%; transform: translateY(-50%); font-size: 26px; }
.stk-meter.big { width: 100%; height: 20px; margin: 6px 0; }
.stk-badge { display: flex; align-items: center; gap: 6px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 12px 2px 4px; font: 700 18px var(--font); color: var(--ink); box-shadow: 0 4px 0 rgba(31, 45, 74, 0.2); cursor: pointer; }
.stk-badge-rank { width: 30px; height: 30px; border-radius: 50%; background: #ffe066; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 18px; }
.stk-badge.bump { animation: stkBump 0.6s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes stkBump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.stk-book .menu-body { background: #fffaf2; }
.stk-rank { display: flex; align-items: center; gap: 14px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; }
.stk-rank-icon { font-size: 48px; }
.stk-rank-mid { flex: 1; min-width: 0; }
.stk-rank-mid b { font-size: 22px; }
.stk-count { font-size: 30px; font-weight: 700; text-align: right; }
.stk-count small { display: block; font-size: 14px; opacity: 0.6; }
.stk-h { margin: 18px 0 8px; padding: 4px 14px; display: inline-block; border-radius: 999px; background: var(--c); border: 3px solid var(--ink); font-size: 18px; }
.stk-h small { opacity: 0.7; margin-left: 6px; }
.stk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.stk-cell { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border-radius: 14px; font-family: var(--font); color: var(--ink); }
.stk-cell:hover, .stk-cell:focus-visible { background: rgba(255, 224, 102, 0.35); outline: none; }
.stk-name { font-size: 13px; font-weight: 700; text-align: center; line-height: 1.15; }
.stk-cell.empty .stk-name { opacity: 0.45; }
.stk-soon { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.stk-soon-item { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; font-family: var(--font); color: var(--ink); cursor: pointer; }
.stk-soon-item .stk-meter { width: 100%; margin: 4px 0 2px; }
.stk-trails { display: flex; flex-wrap: wrap; gap: 8px; }
.stk-trail { display: flex; flex-direction: column; align-items: center; width: 92px; padding: 6px 4px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; font-family: var(--font); color: var(--ink); cursor: pointer; }
.stk-trail span { font-size: 30px; }
.stk-trail small { font-size: 11px; font-weight: 700; text-align: center; }
.stk-trail.on { background: #ffe066; box-shadow: 0 0 0 3px #fff inset; }
.stk-trail.locked { opacity: 0.55; }
.stk-tip { position: sticky; top: -16px; z-index: 2; display: flex; align-items: center; gap: 12px; background: #fff6d0; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; font-size: 17px; }
.stk-tip .stk { width: 48px; height: 48px; }
.stk-tip .stk span { font-size: 24px; }

/* layering: world prompts and quest pips (z 2-3) sit under messages (hint, toasts, landmark cards),
   and every card or dialog sits over all of them */
.hint, .toasts, .lm-card { z-index: 6; }
.menu-back, .dialog { z-index: 10; }

/* ---- game feel (audio lane): bouncier pop-ins ---- */
/* the dialog centres itself with translateX(-50%), so its pop-in must keep that (toastIn replaced the
   whole transform and the box slid in from the right) */
@keyframes dialogIn { 0% { transform: translateX(-50%) translateY(20px) scale(0.85); opacity: 0; } 60% { transform: translateX(-50%) translateY(-2px) scale(1.03); opacity: 1; } 100% { transform: translateX(-50%); } }
@keyframes toastIn { 0% { transform: translateY(-20px) scale(0.6); opacity: 0; } 60% { transform: translateY(2px) scale(1.08); opacity: 1; } 100% { transform: none; } }
@keyframes pickIn { 0% { transform: translateX(40px) scale(0.6); opacity: 0; } 60% { transform: translateX(-4px) scale(1.12); opacity: 1; } 100% { transform: none; } }
.pickup.pkbump img { animation: pkbump 0.35s cubic-bezier(.3, 1.8, .5, 1); }
.pickup.pkbump b { display: inline-block; animation: pkbump 0.35s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes pkbump { 0% { transform: scale(1); } 40% { transform: scale(1.45) rotate(-6deg); } 100% { transform: scale(1); } }
.btn:active { transition: transform 0.05s; }

/* ---------- Adventurer Skills + Dream Upgrades (src/progress/skills.js) ---------- */
.sk-pop { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 8px 22px 8px 8px; box-shadow: var(--shadow); animation: skIn 0.5s cubic-bezier(.3, 1.6, .5, 1) both; pointer-events: none; z-index: 39; }
.sk-pop b { display: block; font-size: 24px; }
.sk-pop small { font-size: 15px; font-weight: 700; color: var(--ink2); }
.sk-pop.out { animation: skOut 0.4s ease-in forwards; }
.sk-pop-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; background: var(--c); border: 3px solid var(--ink); }
@keyframes skIn { from { transform: translate(-50%, -60px) scale(0.6); opacity: 0; } }
@keyframes skOut { to { transform: translate(-50%, -40px); opacity: 0; } }
.sk-sub { margin: 4px 0 12px; font-size: 17px; }
.sk-rows { display: flex; flex-direction: column; gap: 10px; }
.sk-row { background: #fff; border: 3px solid var(--ink); border-left: 12px solid var(--c); border-radius: 18px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sk-skill { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0; }
.sk-icon { font-size: 40px; }
.sk-mid { flex: 1; min-width: 0; }
.sk-mid b { font-size: 20px; }
.sk-mid b span { background: var(--c); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font-size: 15px; margin-left: 4px; }
.sk-mid small { opacity: 0.7; }
.sk-stars { font-size: 24px; font-weight: 700; animation: stkBump 1.2s infinite alternate; }
.sk-perks { display: flex; gap: 8px; flex: 1 1 360px; }
.sk-perk { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border: 3px solid rgba(31, 45, 74, 0.35); border-radius: 16px; background: #faf6f0; font-family: var(--font); color: var(--ink); cursor: pointer; text-align: center; }
.sk-perk-icon { font-size: 30px; }
.sk-perk b { font-size: 15px; }
.sk-perk small { font-size: 12px; opacity: 0.8; line-height: 1.15; }
.sk-pips { color: var(--c, #ffb347); font-size: 14px; letter-spacing: 2px; -webkit-text-stroke: 0.5px var(--ink); }
.sk-perk.can { border-color: var(--ink); background: #fff6c8; box-shadow: 0 0 0 3px #ffe066, 0 4px 0 var(--ink); animation: skGlow 1.4s infinite alternate; }
.sk-perk.can i { position: absolute; top: -12px; right: -6px; font-style: normal; font-weight: 700; font-size: 13px; background: #ffe066; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
.sk-perk.max { opacity: 0.75; }
.sk-perk.bought { animation: stkBump 0.6s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes skGlow { to { box-shadow: 0 0 0 5px #ffe066, 0 4px 0 var(--ink); } }
.sk-dream { position: absolute; inset: 0; display: flex; background: radial-gradient(ellipse at 50% 20%, rgba(60, 60, 140, 0.55), rgba(10, 14, 40, 0.85)); z-index: 30; pointer-events: auto; animation: menuIn 0.3s both; overflow: auto; padding: 16px; }
.sk-dream.out { opacity: 0; transition: opacity 0.3s; }
.sk-dream-card { margin: auto; width: min(900px, 96vw); background: var(--cream); border: 3px solid var(--ink); border-radius: 24px; padding: 16px 18px; box-shadow: var(--shadow); text-align: center; }
.sk-dream-card h2 { margin: 0; font-size: 32px; }
.sk-dream-card .sk-rows { text-align: left; }
.sk-dream-card .sk-done { margin-top: 14px; }
@media (max-width: 760px) { .sk-perks { flex-basis: 100%; } }

/* ---------- Keeper Wardrobe (src/progress/wardrobe.js) ---------- */
.wd-tip { margin: 2px 0 8px; font-size: 15px; }
.wd-tip img, .wd-cost img { width: 20px; height: 20px; vertical-align: middle; }
.wd-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
.wd-slot { width: 140px; font-size: 16px; }
.wd-items { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.wd-item { position: relative; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; font-family: var(--font); color: var(--ink); cursor: pointer; }
.wd-item small { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.1; }
.wd-ic { font-size: 28px; line-height: 1.1; }
.wd-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15); }
.wd-item.on { background: #ffe066; box-shadow: 0 0 0 3px #fff inset; }
.wd-item.locked, .wd-item.need { opacity: 0.55; }
.wd-item.make { background: #fff6c8; animation: skGlow 1.4s infinite alternate; box-shadow: 0 0 0 3px #ffe066; }
.wd-item i { position: absolute; top: -10px; right: -6px; font-style: normal; font-weight: 700; font-size: 12px; background: #ffe066; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; }
.wd-costs { display: flex; gap: 4px; font-size: 12px; font-weight: 700; }
.wd-cost { display: flex; align-items: center; gap: 1px; }

/* ---------- The ramp: one NEW! card per feature (src/progress/unlocks.js) ---------- */
.unl-card { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); width: min(560px, 92vw); display: flex; align-items: center; gap: 14px; background: var(--cream); border: 4px solid var(--ink); border-radius: 24px; padding: 14px 20px 14px 14px; box-shadow: var(--shadow); animation: skIn 0.55s cubic-bezier(.3, 1.6, .5, 1) both; pointer-events: none; z-index: 41; }
.unl-card.out { animation: skOut 0.4s ease-in forwards; }
.unl-new { position: absolute; top: -16px; left: 18px; background: #ff7a2e; color: #fff; font-weight: 700; font-size: 16px; border: 3px solid var(--ink); border-radius: 999px; padding: 1px 12px; }
.unl-icon { width: 76px; height: 76px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 44px; background: #ffe066; border: 3px solid var(--ink); }
.unl-txt b { display: block; font-size: 26px; }
.unl-txt span { font-size: 17px; font-weight: 600; color: var(--ink2); }
.stk-pop-name small { font-size: 20px; color: #ffe066; }
/* calm pop-ups (src/ui/notify.js): several stickers share one card; the badge gets a soft dot for quiet ones */
.stk-pop-row { display: flex; gap: 10px; animation: stkSlap 0.7s cubic-bezier(.3, 1.7, .5, 1) both; }
.stk-badge { position: relative; }
.stk-badge.has-new::after { content: ''; position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%; background: #ff5a5a; border: 2px solid var(--ink); animation: stkDot 1.6s ease-in-out infinite; }
@keyframes stkDot { 50% { transform: scale(1.25); } }
/* ---------- kid-friendly UI: a picture for every goal, big tiles, big tabs ---------- */
.q-goal { align-items: center; }
.q-ico { flex: none; font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(31, 45, 74, 0.25)); }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.tab-ico { font-size: 26px; line-height: 1; }
.menu-body { background: #fffaf3; }
.inv-grid.items { grid-template-columns: repeat(7, 76px); gap: 10px; }
.inv-grid.items .slot { width: 76px; height: 76px; border-radius: 18px; }
.inv-grid.items .slot img { width: 58px; height: 58px; }
.inv-grid.items .slot .cnt { font-size: 19px; right: 6px; bottom: 2px; }
.pause-grid { width: min(470px, 94vw); gap: 12px; padding: 22px 24px; }
.pause-goal { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(180deg, #fff6c9, #ffe27a); font-family: var(--font); font-weight: 700; font-size: 17px; color: var(--ink); text-align: left; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.pause-goal:hover { filter: brightness(1.04); }
.pg-ico { font-size: 38px; line-height: 1; flex: none; }
.pg-txt { flex: 1; line-height: 1.2; }
.pg-txt small, .legend-goal small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b06a00; }
.pg-say { font-size: 24px; flex: none; }
.pause-keep { font-size: 24px; padding: 14px; }
.pause-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pause-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 10px; border-radius: 20px; }
.pt-ico { font-size: 40px; line-height: 1; }
.pt-lbl { font-size: 16px; }
.pause-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.legend-goal { display: flex; gap: 10px; align-items: center; padding: 8px 12px; margin-bottom: 10px !important; border: 3px solid var(--ink); border-radius: 16px; background: linear-gradient(180deg, #fff6c9, #ffe27a); font-size: 16px; line-height: 1.2; }
.legend-goal > span { font-size: 32px; line-height: 1; }
button.legend-goal { width: 100%; text-align: left; cursor: pointer; color: var(--ink); }
@media (max-width: 620px) { .inv-grid.items { grid-template-columns: repeat(4, 72px); } .inv-grid.items .slot { width: 72px; height: 72px; } .pt-ico { font-size: 34px; } }
.tab.on { background: #fffaf3; }
.pause-grid .pause-tiles { grid-template-columns: repeat(2, 1fr); }
.pause-grid .pause-more { grid-template-columns: repeat(3, 1fr); }
/* five tiles: three across the top, Settings and Save & quit side by side underneath */
.pause-grid .pause-tiles.three { grid-template-columns: repeat(6, 1fr); }
.pause-tiles.three > * { grid-column: span 2; }
.pause-tiles.three > :nth-last-child(-n+2) { grid-column: span 3; }
.pause-more .pt-ico { font-size: 30px; }
.pause-more .pt-lbl { font-size: 14px; }
.pause-morebtn { align-self: center; }

/* ---- controllers (src/ui/padicons.js): button pictures, and a big ring on whatever a press would pick ---- */
.padb { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: 1.7em; padding: 0 0.45em; margin: 0 4px; border-radius: 0.6em; background: #2d3445; color: #fff; font-weight: 800; font-size: 0.95em; line-height: 1; border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); vertical-align: middle; }
.padb-face { border-radius: 50%; padding: 0; width: 1.7em; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.t-keys .padb { font-size: 20px; margin: 0 2px; }
body.pad button:focus, body.pad .focusable:focus, body.pad .slot:focus, body.pad input:focus { outline: 5px solid #ffd36b; outline-offset: 3px; }
body.pad .b-btn kbd, body.pad .bb-lantern kbd { display: none; }

/* Play Together: the green friend marker (src/together/marker.js) */
.friend-mark { position: absolute; left: 0; top: 0; margin: -22px 0 0 -22px; z-index: 6; pointer-events: auto; cursor: pointer; }
.friend-mark .fm-dot { width: 44px; height: 44px; border-radius: 50%; background: #35e08a; border: 3px solid #0d3a22; display: grid; place-items: center; font-size: 22px; box-shadow: 0 0 14px rgba(53,224,138,.8); animation: fm-pulse 1.4s ease-in-out infinite; }
.friend-mark .fm-txt { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); white-space: nowrap; font-weight: 800; font-size: 14px; color: #fff; background: rgba(13,58,34,.85); border-radius: 999px; padding: 2px 9px; }
.friend-mark .fm-arrow { display: none; position: absolute; left: 22px; top: 22px; width: 0; height: 0; transform-origin: 0 0; }
.friend-mark.edge .fm-arrow { display: block; }
.friend-mark.edge .fm-arrow::after { content: ''; position: absolute; left: 24px; top: -10px; border-left: 16px solid #35e08a; border-top: 10px solid transparent; border-bottom: 10px solid transparent; filter: drop-shadow(0 0 3px #0d3a22); }
@keyframes fm-pulse { 50% { transform: scale(1.08); } }
/* Play Together: a friend's battle (src/together/fights.js) */
.tg-fight { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; min-width: 260px; max-width: 86vw; background: rgba(16,24,40,.88); border: 3px solid #35e08a; border-radius: 16px; padding: 8px 14px 10px; color: #fff; font-weight: 700; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.tg-fight.helping { border-color: #ffd84a; }
.tg-fight .tf-head { font-size: 16px; margin-bottom: 6px; text-align: center; }
.tg-fight .tf-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; margin: 4px 0; }
.tg-fight .tf-bar i { display: block; height: 100%; transition: width .3s; }
.tg-fight .tf-bar.foe i { background: #ff5a4a; }
.tg-fight .tf-bar.ally i { background: #35e08a; }
.tg-fight .tf-sub { font-size: 14px; text-align: center; margin-top: 4px; color: #ffe066; }
.tg-fight .tf-sub:empty { display: none; }

/* First departure: the sky, three friends and one obvious way into the adventure. */
.voyage-title { gap: 12px; padding: 28px 20px 54px; background: linear-gradient(0deg, rgba(20, 45, 76, .56), transparent 74%); }
.title-crest { display: flex; align-items: center; gap: 18px; color: #efd8a5; font-size: 27px; }
.title-crest i { width: 62px; height: 1px; background: linear-gradient(90deg, transparent, #efd8a5); }
.title-crest i:last-child { rotate: 180deg; }
.voyage-title .logo { flex-direction: column; align-items: center; font-size: clamp(48px, 7.8vw, 104px); line-height: .98; letter-spacing: .035em; gap: 5px; }
.voyage-title .logo span { animation: none; color: #fff2cf; -webkit-text-stroke: 1px #233f46; text-shadow: 0 3px 0 #233f46, 0 8px 24px #183d4655; }
.voyage-title .logo-word:last-child span { color: #f4cc7d; }
.voyage-title .logo-word:last-child { font-size: 1.17em; }
.voyage-title .subtitle { font-size: clamp(18px, 2.4vw, 26px); margin-top: 8px; letter-spacing: .02em; }
.title-friends { display: flex; align-items: end; justify-content: center; gap: 5px; margin-top: 0; height: 118px; }
.title-friends img { width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(0 5px 0 rgba(31,45,74,.22)); animation: arrival .5s ease-out both; }
.title-friends img:nth-child(2) { transform: translateY(-8px); animation-delay: .08s; }
.title-friends img:nth-child(3) { animation-delay: .16s; }
.voyage-title .title-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 2px; width: min(380px, 90vw); min-width: 0; }
.voyage-title .title-play { grid-column: 1 / -1; font-size: 27px; padding: 17px 30px; border-radius: 18px; background: linear-gradient(#fce6a7, #e4b86d); color: #243e3e; border: 2px solid #f7e4b6; text-shadow: 0 1px #fff8db; box-shadow: 0 4px 0 #7a653f, 0 12px 24px #142f3a55; }
